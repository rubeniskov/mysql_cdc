[package]
name = "mysql_cdc"
version = "0.2.1"
edition = "2021"
authors = ["Ruslan Ulianets <ruslan.ulianets@gmail.com>"]
description = "MySQL/MariaDB binlog change data capture (CDC) connector for Rust"
homepage = "https://github.com/rusuly/mysql_cdc"
repository = "https://github.com/rusuly/mysql_cdc"
license = "MIT"

[dependencies]
byteorder = "1.4.3"
sha1 = "0.10.5"
sha2 = "0.10.6"

hex = "0.4.3"

rsa   = { version = "0.9", features = ["pkcs5"] }

# --- TLS backends (optional, feature-gated) ---
native-tls = { version = "0.2", optional = true }
rustls = { version = "0.23", features = ["std"], optional = true }
rustls-pki-types = { version = "1", optional = true }
rustls-native-certs = { version = "0.8.1", optional = true }
webpki-roots = { version = "1.0.2", optional = true }

[features]
default = ["native-tls"]
native-tls = ["dep:native-tls"]
rustls-tls = [
  "dep:rustls",
  "dep:rustls-pki-types",
  "dep:rustls-native-certs",
  "dep:webpki-roots"
]